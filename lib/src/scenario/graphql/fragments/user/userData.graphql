fragment UserData on User {
  id
  nameID
  firstName
  lastName
  email
  phone
  account {
    ...AccountData
  }
  actor {
    ...AgentData
  }
  credentials {
    id
    resourceID
    type
  }
  profile {
    ...ProfileDataUser
  }

  settings {
    ...userSettingsFragment
  }
  authorization {
    myPrivileges
    credentialRules {
      name
    }
  }
}
