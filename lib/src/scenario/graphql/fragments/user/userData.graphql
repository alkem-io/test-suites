fragment UserData on User {
  id
  nameID
  firstName
  lastName
  email
  phone
  accountUpn
  account {
    ...AccountData
  }
  agent {
    ...AgentData
  }
  profile {
    ...ProfileDataUser
  }

  settings {
    ...userSettingsFragment
  }
  authorization {
    myPrivileges
    credentialRules {
      name
    }
  }
}
