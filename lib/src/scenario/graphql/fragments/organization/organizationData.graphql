fragment OrganizationData on Organization {
  id
  nameID
  roleSet {
    id
  }
  legalEntityName
  domain
  website
  contactEmail
  account {
    ...AccountData
  }
  actor {
    id
  }
  roleSet {
    usersInRole(role: ASSOCIATE) {
      ...MemberData
    }
  }
  profile {
    ...ProfileDataUser
  }
  verification {
    authorization {
      ...AuthorizationData
    }
    id
    status
    state
    nextEvents
    isFinalized
    lifecycle {
      id
    }
  }
  settings {
    privacy {
      contributionRolesPubliclyVisible
    }
    membership {
      allowUsersMatchingDomainToJoin
    }
  }
  authorization {
    ...AuthorizationData
  }
}
