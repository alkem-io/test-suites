fragment InvitationData on Invitation {
  id
  state
  nextEvents
  isFinalized
  createdDate
  extraRoles
  invitedToParent
  welcomeMessage
  lifecycle {
    id
  }
  createdBy {
    ...UserDataLight
  }
  actor {
    id
    type
    profile {
      id
      displayName
    }
  }
  spacesToJoinOnAccept {
    id
    profile {
      id
      displayName
    }
  }
  authorization {
    myPrivileges
  }
}
