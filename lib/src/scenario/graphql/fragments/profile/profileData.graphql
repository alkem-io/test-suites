fragment ProfileData on Profile {
  id
  displayName
  description
  url
  references {
    authorization {
      myPrivileges
    }
    ...ReferenceData
  }
  tagline
  tagsets {
    authorization {
      myPrivileges
    }
    ...TagsetData
  }
  location {
    country
    city
  }
  authorization {
    myPrivileges
  }
  ...ProfileStorageConfig
}
