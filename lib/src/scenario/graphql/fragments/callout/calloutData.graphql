fragment CalloutData on Callout {
  id
  activity
  authorization {
    myPrivileges
  }
  comments {
    id
    messages {
      message
    }
    messagesCount
  }

  contributions {
    ...ContributionsData
  }
  createdBy {
    email
  }
  framing {
    id
    profile {
      ...ProfileData
    }
    whiteboard {
      id
      nameID
      profile {
        ...ProfileStorageConfig
        ...ProfileData
        visual(type: CARD) {
          ...VisualUri
          __typename
        }
      }
    }
  }
  nameID
  publishedBy {
    email
  }
  publishedDate
  sortOrder
  settings {
    framing {
      commentsEnabled
    }
    contribution {
      enabled
      canAddContributions
      commentsEnabled
    }
    visibility
  }
}
