mutation updateInnovationFlowCurrentState(
  $innovationFlowId: UUID!
  $currentStateID: UUID!
) {
  updateInnovationFlowCurrentState(
    innovationFlowStateData: {
      innovationFlowID: $innovationFlowId
      currentStateID: $currentStateID
    }
  ) {
    id
    currentState {
      displayName
      __typename
    }
    __typename
  }
}
