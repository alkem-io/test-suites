# The inviter (the caller of this mutation) is never the invited actor's
# account admin, so it deliberately does NOT select `spacesToJoinOnAccept` —
# the server gates that field to the invited actor's account admins and
# denies every other caller. Read it separately as the invited actor's own
# admin (see meQuery.graphql) when a test needs the ancestor-chain list.
mutation InviteForEntryRoleOnRoleSet(
  $roleSetId: UUID!
  $invitedActorIds: [UUID!]!
  $invitedUserEmails: [String!]!
  $welcomeMessage: String
  $extraRoles: [RoleName!]!
) {
  inviteForEntryRoleOnRoleSet(
    invitationData: {
      invitedActorIDs: $invitedActorIds
      invitedUserEmails: $invitedUserEmails
      roleSetID: $roleSetId
      welcomeMessage: $welcomeMessage
      extraRoles: $extraRoles
    }
  ) {
    type
    notice
    invitation {
      id
      state
      extraRoles
      invitedToParent
      actor {
        id
        type
        profile {
          id
          displayName
          __typename
        }
        __typename
      }
      __typename
    }
    platformInvitation {
      id
      email
      firstName
      lastName
      __typename
    }
    __typename
  }
}
