mutation InviteForEntryRoleOnRoleSet(
  $roleSetId: UUID!
  $invitedActorIds: [UUID!]!
  $invitedUserEmails: [String!]!
  $welcomeMessage: String
  $extraRoles: [RoleName!]!
) {
  inviteForEntryRoleOnRoleSet(
    invitationData: {
      invitedActorIDs: $invitedActorIds
      invitedUserEmails: $invitedUserEmails
      roleSetID: $roleSetId
      welcomeMessage: $welcomeMessage
      extraRoles: $extraRoles
    }
  ) {
    type
    notice
    invitation {
      id
      state
      extraRoles
      invitedToParent
      actor {
        id
        type
        profile {
          id
          displayName
          __typename
        }
        __typename
      }
      spacesToJoinOnAccept {
        id
        profile {
          id
          displayName
          __typename
        }
        __typename
      }
      __typename
    }
    platformInvitation {
      id
      email
      firstName
      lastName
      __typename
    }
    __typename
  }
}
