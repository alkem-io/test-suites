mutation UpdateOrganizationSettings(
  $settingsData: UpdateOrganizationSettingsInput!
) {
  updateOrganizationSettings(settingsData: $settingsData) {
    id
    settings {
      privacy {
        contributionRolesPubliclyVisible
      }
      membership {
        allowUsersMatchingDomainToJoin
      }
    }
  }
}
