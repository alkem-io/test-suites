mutation createPollCalloutOnCalloutsSet(
  $calloutData: CreateCalloutOnCalloutsSetInput!
) {
  createCalloutOnCalloutsSet(calloutData: $calloutData) {
    id
    settings {
      visibility
    }
    framing {
      id
      type
      profile {
        id
        displayName
      }
      poll {
        ...PollDefinition
      }
    }
  }
}
