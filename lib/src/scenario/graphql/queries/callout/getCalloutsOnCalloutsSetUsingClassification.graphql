query GetCalloutsOnCalloutsSetUsingClassification(
  $calloutsSetId: UUID!
  $classificationTagsets: [TagsetArgs!] = []
  $withClassification: Boolean = true
) {
  lookup {
    calloutsSet(ID: $calloutsSetId) {
      id
      authorization {
        id
        myPrivileges
        __typename
      }
      callouts(classificationTagsets: $classificationTagsets) {
        ...Callout
        ...ClassificationDetails @include(if: $withClassification)
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment Callout on Callout {
  id
  nameID
  sortOrder
  activity
  authorization {
    id
    myPrivileges
    __typename
  }
  framing {
    id
    profile {
      id
      url
      displayName
      __typename
    }
    __typename
  }
  settings {
    visibility
    __typename
  }
}

fragment ClassificationDetails on Callout {
  classification {
    id
    flowState: tagset(tagsetName: FLOW_STATE) {
      ...TagsetDetails
      __typename
    }
    __typename
  }
  __typename
}

fragment TagsetDetails on Tagset {
  id
  name
  tags
  allowedValues
  type
  __typename
}
