query GetRolesOrganization($organizationID: UUID!) {
  rolesOrganization(rolesData: { actorID: $organizationID }) {
    spaces {
      id
      nameID
      roles
      subspaces {
        displayName
        nameID
        id
        roles
      }
    }
    organizations {
      nameID
      id
      roles
    }
  }
}
