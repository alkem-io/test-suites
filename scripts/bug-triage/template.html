<title>Alkemio Open Bug Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F2F4F7;--surface:#FFFFFF;--surface2:#E9EDF2;--ink:#161E28;--ink2:#4F5D6B;--ink3:#7E8A97;--line:#D5DBE3;--accent:#0E6B78;--accent-ink:#FFFFFF;--high:#B3261E;--high-bg:#FBE9E7;--med:#9A5B00;--med-bg:#FBF0DD;--low:#3E5A7A;--low-bg:#E5ECF4;--prod:#5B2E91;--prod-bg:#EFE7F8;--focus:#0E6B78;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141B;--surface:#161E27;--surface2:#1E2832;--ink:#E7ECF1;--ink2:#A7B3BF;--ink3:#7A8794;--line:#2A3541;--accent:#4FB7C4;--accent-ink:#0B1A1D;--high:#F0857D;--high-bg:#3A1C1A;--med:#E4A64A;--med-bg:#3A2A10;--low:#9BB7D6;--low-bg:#1E2A38;--prod:#C4A6EA;--prod-bg:#2B2140;--focus:#4FB7C4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141B;--surface:#161E27;--surface2:#1E2832;--ink:#E7ECF1;--ink2:#A7B3BF;--ink3:#7A8794;--line:#2A3541;--accent:#4FB7C4;--accent-ink:#0B1A1D;--high:#F0857D;--high-bg:#3A1C1A;--med:#E4A64A;--med-bg:#3A2A10;--low:#9BB7D6;--low-bg:#1E2A38;--prod:#C4A6EA;--prod-bg:#2B2140;--focus:#4FB7C4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:0 48px;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.1}
h2{font-size:20px;margin-block:0 10px}
.mono,.num,td.n,.age,.badge{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-block:36px 20px;border-bottom:1px solid var(--line)}
header p{margin:8px 0 0;color:var(--ink2);max-width:62ch}
.totals{display:flex;gap:2px;font-family:"IBM Plex Mono",monospace;font-size:13px}
.totals div{padding:8px 14px;background:var(--surface2);border-radius:2px}
.totals div:first-child{border-radius:6px 2px 2px 6px}.totals div:last-child{border-radius:2px 6px 6px 2px}
.totals b{display:block;font-size:22px;font-weight:500;line-height:1.1}
.totals .h b{color:var(--high)}.totals .m b{color:var(--med)}.totals .l b{color:var(--low)}
section{margin-top:32px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}header{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;white-space:nowrap}
.matrix td.total{font-weight:500}.matrix .sev-h{color:var(--high);font-weight:500}
.matrix tr.sum td{border-top:2px solid var(--ink3);border-bottom:none;font-weight:500}
.matrix .link{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline dotted var(--ink3);text-underline-offset:3px}
.matrix .link:hover{color:var(--accent)}
.stack{display:grid;gap:24px;align-content:start}
.note{font-size:13px;color:var(--ink2);max-width:70ch;margin:10px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
.filters label{display:grid;gap:4px;font-size:12px;color:var(--ink3);font-family:"IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.filters select,.filters input{font:14px "IBM Plex Sans",sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:130px}
.filters input{min-width:220px}
.filters .count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink2);align-self:center}
.filters button.reset{font:13px "IBM Plex Sans",sans-serif;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:4px;padding:6px 10px;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sevhead{display:flex;align-items:baseline;gap:12px;margin:32px 0 8px;padding-left:12px;border-left:4px solid var(--ink3)}
.sevhead.High{border-color:var(--high)}.sevhead.Medium{border-color:var(--med)}.sevhead.Low{border-color:var(--low)}
.sevhead .cnt{font-family:"IBM Plex Mono",monospace;color:var(--ink2);font-size:14px}
.sevhead .def{font-size:13px;color:var(--ink2)}
.bugs td.n a{color:var(--ink2);text-decoration:none}.bugs td.n a:hover{color:var(--accent);text-decoration:underline}
.bugs td.t a{color:var(--ink);text-decoration:none}.bugs td.t a:hover{color:var(--accent);text-decoration:underline}
.bugs td.repo{color:var(--ink2);white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.bugs td.area{color:var(--ink2);white-space:nowrap;font-size:13px}
.bugs .age{white-space:nowrap;color:var(--ink2)}
.bugs tr.old .age{color:var(--ink3)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;line-height:1.5;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.badge.prod{background:var(--prod-bg);color:var(--prod)}
.badge.unl{background:var(--surface2);color:var(--ink3)}
.bugs tbody tr:hover td{background:var(--surface)}
.empty{padding:20px 10px;color:var(--ink3)}
@media (max-width:640px){.bugs td.area,.bugs th.area{display:none}}
.tg{background:none;border:1px solid var(--line);border-radius:3px;color:var(--ink2);font:12px "IBM Plex Mono",monospace;width:22px;height:22px;line-height:1;cursor:pointer;padding:0}
.tg[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
tr.body>td{background:var(--surface);padding:14px 16px 16px 44px;border-bottom:1px solid var(--line)}
.md{max-width:78ch;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{font-size:14px;margin:14px 0 4px;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2)}
.md p,.md ul,.md ol{margin:6px 0}.md ul,.md ol{padding-left:22px}
.md pre{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.45}
.md code{font-family:"IBM Plex Mono",monospace;font-size:.92em;background:var(--surface2);padding:1px 4px;border-radius:3px}.md pre code{background:none;padding:0}
.md a{color:var(--accent)}.md .img{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);border:1px dashed var(--line);padding:2px 8px;border-radius:3px;margin:2px 0}
.md table{width:auto;font-size:13px;margin:8px 0}.md th,.md td{padding:4px 8px}
.md blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--ink2)}
.md input[type=checkbox]{margin-right:6px}
.md .meta{display:flex;gap:16px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);margin-bottom:10px}
.md .empty-body{color:var(--ink3);font-style:italic}
footer{margin-top:40px;font-size:13px;color:var(--ink3);max-width:80ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;margin-top:20px}
.kpis div{background:var(--surface2);padding:10px 14px;border-radius:2px}
.kpis div:first-child{border-radius:6px 2px 2px 6px}.kpis div:last-child{border-radius:2px 6px 6px 2px}
.kpis b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:22px;line-height:1.1}
.kpis span{font-size:12px;color:var(--ink2)}
.kpis .warn b{color:var(--med)}.kpis .bad b{color:var(--high)}.kpis .go b{color:var(--accent)}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 6px;border-radius:3px;line-height:1.5;margin:1px 4px 1px 0;white-space:nowrap;text-decoration:none;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.open{border-color:var(--accent);color:var(--accent)}
.chip.merged{background:var(--med-bg);color:var(--med);border-color:transparent}
.chip.rel{background:var(--prod-bg);color:var(--prod);border-color:transparent}
.chip.none{color:var(--high);border-style:dashed}
.chip.epic{color:var(--ink3)}
td.st{white-space:nowrap;max-width:260px}
@media (max-width:820px){td.st,th.st{display:none}}
.rel td.v{font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap;padding-inline:6px}
.rel td.n{white-space:nowrap}
.rel td,.rel th{padding-inline:6px}
.rel td.n a{color:var(--ink);text-decoration:none}.rel td.n a:hover{color:var(--accent);text-decoration:underline}
.rel tr.open td{background:var(--surface)}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 14px 8px}
.viz h3{font-size:15px;margin:0 0 2px}
.viz .sub{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;fill:var(--ink2)}
.viz .grid line{stroke:var(--line);stroke-width:1}
.viz .axis{stroke:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:14px}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.charts .wide{grid-column:1/-1}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--bg);font:12px "IBM Plex Mono",monospace;padding:6px 8px;border-radius:4px;display:none;max-width:260px;white-space:pre-line}
.viz .hit{fill:transparent}
.viz rect.mark:hover,.viz .hit:hover+rect{opacity:.85}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--s9:#8d97a2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#6f7b87}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#6f7b87}
.trendtab td.num{font-family:"IBM Plex Mono",monospace}
.callout{border-left:4px solid var(--prod);padding:10px 14px;background:var(--surface);font-size:13.5px;color:var(--ink2);margin-top:14px;max-width:80ch}
.callout b{color:var(--ink)}
.oa{font-size:13px;color:var(--ink2);margin:8px 0 0}
</style>

<div id="tip" role="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.7/purify.min.js"></script>
<script>
const ROWS={{ROWS}};
const TREND={{TREND}};
const DEF={High:'Blocks a flow, crashes, loses data, or touches auth/security',Medium:'Functional defect with a workaround or limited reach',Low:'Cosmetic or wording'};
const $=s=>document.querySelector(s);
const F={sev:$('#f-sev'),area:$('#f-area'),repo:$('#f-repo'),age:$('#f-age'),flag:$('#f-flag'),plan:$('#f-plan'),q:$('#f-q')};
function ageText(d){return d<1?'today':d<60?d+'d':d<365?Math.round(d/30)+'mo':(d/365).toFixed(1)+'y'}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
function chips(r){
  let h='';
  for(const p of r.po) h+=`<a class="chip open" href="${p.u}" target="_blank" rel="noopener" title="${esc(p.t)}">PR ${p.repo==r.repo?'':p.repo+' '}#${p.n}${p.d?' draft':''} open</a>`;
  for(const p of r.pm) h+=`<a class="chip merged" href="${p.u}" target="_blank" rel="noopener" title="${esc(p.t)} — merged ${p.at}">PR ${p.repo==r.repo?'':p.repo+' '}#${p.n} merged</a>`;
  for(const p of r.rl) h+=`<a class="chip rel" href="${p.u}" target="_blank" rel="noopener">${esc(p.t)}</a>`;
  if(r.ep) h+='<span class="chip epic" title="Sub-issue of an epic">epic</span>';
  if(r.bd) h+='<span class="chip" title="On the delivery board">board</span>';
  if(!h) h='<span class="chip none" title="Not on the board, no PR, no release story">no signal</span>';
  return h;
}
function render(){
  const q=F.q.value.trim().toLowerCase();
  const rows=ROWS.filter(r=>(!F.sev.value||r.s===F.sev.value)&&(!F.area.value||r.a===F.area.value)&&(!F.repo.value||r.repo===F.repo.value)&&(!F.age.value||r.ab===F.age.value)&&(!F.flag.value||(F.flag.value==='prod'?r.p:F.flag.value==='unl'?!r.l:!r.asg))&&(!F.plan.value||r.pl===F.plan.value)&&(!q||r.t.toLowerCase().includes(q)||String(r.n).includes(q)));
  $('#count').textContent=rows.length+' of '+ROWS.length+' shown';
  let html='';
  for(const s of ['High','Medium','Low']){
    const g=rows.filter(r=>r.s===s); if(!g.length) continue;
    html+=`<div class="sevhead ${s}"><h3>${s}</h3><span class="cnt">${g.length}</span><span class="def">${DEF[s]}</span></div><div class="scroll"><table class="bugs"><thead><tr><th></th><th>Repo</th><th>#</th><th>Title</th><th class="area">Area</th><th class="st">Where it stands</th><th class="num">Age</th></tr></thead><tbody>`;
    for(const r of g){
      html+=`<tr class="${r.d>365?'old':''}" data-k="${r.repo}/${r.n}"><td><button class="tg" type="button" aria-expanded="false" aria-label="Show body of #${r.n}" data-k="${r.repo}/${r.n}">+</button></td><td class="repo">${r.repo}</td><td class="n"><a href="${r.u}" target="_blank" rel="noopener">#${r.n}</a></td><td class="t"><a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)}</a>${r.p?'<span class="badge prod">prod</span>':''}${r.l?'':'<span class="badge unl">no bug label</span>'}</td><td class="area">${esc(r.a)}</td><td class="st">${chips(r)}</td><td class="num age" title="opened ${r.c}">${ageText(r.d)}</td></tr>`;
    }
    html+='</tbody></table></div>';
  }
  $('#list').innerHTML=html||'<p class="empty">No open bugs match these filters.</p>';
}
Object.values(F).forEach(el=>el.addEventListener('input',render));
$('#f-reset').addEventListener('click',()=>{Object.values(F).forEach(el=>el.value='');render()});
const BY={};ROWS.forEach(r=>BY[r.repo+'/'+r.n]=r);
if(window.marked){marked.setOptions({gfm:true,breaks:true,headerIds:false,mangle:false});}
function bodyHtml(r){
  let src=r.b&&r.b.trim();
  if(!src) return '<p class="empty-body">This issue has no description.</p>';
  let out=window.marked?marked.parse(src):'<pre>'+esc(src)+'</pre>';
  out=window.DOMPurify?DOMPurify.sanitize(out,{ADD_ATTR:['target']}):esc(src);
  const tpl=document.createElement('template');tpl.innerHTML=out;
  tpl.content.querySelectorAll('img').forEach(im=>{const a=document.createElement('a');a.href=im.getAttribute('src')||'#';a.target='_blank';a.rel='noopener';a.className='img';a.textContent='image: '+(im.getAttribute('alt')||'attachment');im.replaceWith(a);});
  tpl.content.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener';});
  return tpl.innerHTML;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button.tg');
  if(t){const tr=t.closest('tr');const open=t.getAttribute('aria-expanded')==='true';
    if(open){t.setAttribute('aria-expanded','false');t.textContent='+';const nx=tr.nextElementSibling;if(nx&&nx.classList.contains('body'))nx.remove();}
    else{t.setAttribute('aria-expanded','true');t.textContent='–';const r=BY[t.dataset.k];const br=document.createElement('tr');br.className='body';
      br.innerHTML='<td colspan="6"><div class="md"><div class="meta"><span>opened '+r.c+'</span><span>'+(r.l?'labelled bug':'no bug label')+'</span>'+(r.p?'<span>production</span>':'')+'<span>'+(r.asg?'assigned':'unassigned')+'</span><a href="'+r.u+'" target="_blank" rel="noopener">open on GitHub ↗</a></div>'+bodyHtml(r)+'</div></td>';
      tr.after(br);}
    return;}
  const a=e.target.closest('[data-filter-area]'),r=e.target.closest('[data-filter-repo]');if(a){F.area.value=a.dataset.filterArea;render();$('#list').scrollIntoView({behavior:'smooth',block:'start'})}if(r){F.repo.value=r.dataset.filterRepo;render();$('#list').scrollIntoView({behavior:'smooth',block:'start'})}});
render();
</script>
</body></html>
<script>
// ---------- charts ----------
const T=TREND, tip=$('#tip');
function showTip(e,txt){tip.textContent=txt;tip.style.display='block';moveTip(e)}
function moveTip(e){const x=Math.min(e.clientX+12,innerWidth-280),y=e.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;const n=m<=1?1:m<=1.5?1.5:m<=2?2:m<=2.5?2.5:m<=5?5:10;return n*p}
function frame(W,H,pad,ymax,ticks,xlabels,xstep){
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b; let s='';
  s+='<g class="grid">';
  for(let i=0;i<=ticks;i++){const y=pad.t+ih-ih*i/ticks;const val=Math.round(ymax*i/ticks);s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l-6}" y="${y+4}" text-anchor="end">${val}</text>`}
  s+='</g>';
  xlabels.forEach((l,i)=>{if(i%xstep===0||i===xlabels.length-1){const x=pad.l+iw*(i+.5)/xlabels.length;s+=`<text x="${x}" y="${H-pad.b+14}" text-anchor="middle">${l}</text>`}});
  return {s,iw,ih};
}
function mlabel(m){const [y,mo]=m.split('-');return mo==='01'?y:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]}
function drawFlow(){
  const W=900,H=240,pad={l:34,r:8,t:8,b:24};const n=T.months.length;
  const ymax=niceMax(Math.max(...T.opened,...T.closed));const f=frame(W,H,pad,ymax,4,T.months.map(mlabel),2);
  const bw=f.iw/n, g=2, w=(bw-8)/2; let s=f.s;
  T.months.forEach((m,i)=>{const x0=pad.l+bw*i+4;
    [['opened',T.opened[i],'var(--s1)',0],['closed',T.closed[i],'var(--s2)',w+g]].forEach(([k,v,c,dx])=>{const h=f.ih*v/ymax;const y=pad.t+f.ih-h;
      s+=`<rect class="mark" x="${x0+dx}" y="${y}" width="${w-g}" height="${h}" rx="0" fill="${c}" data-t="${m}\n${k}: ${v}"/>`});
    s+=`<rect class="hit" x="${pad.l+bw*i}" y="${pad.t}" width="${bw}" height="${f.ih}" data-t="${m}\nopened ${T.opened[i]} · closed ${T.closed[i]}"/>`;
  });
  s+=`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${pad.t+f.ih}" y2="${pad.t+f.ih}"/>`;
  $('#c-flow').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bugs opened and closed per month">${s}</svg>`;
}
function drawBacklog(){
  const W=440,H=220,pad={l:38,r:10,t:10,b:24};const n=T.months.length;const vals=T.backlog;
  const ymax=niceMax(Math.max(...vals)*1.05);const f=frame(W,H,pad,ymax,4,T.months.map(mlabel),4);
  const pts=vals.map((v,i)=>[pad.l+f.iw*(i+.5)/n,pad.t+f.ih-f.ih*v/ymax]);
  let s=f.s;
  s+=`<path d="M${pts.map(p=>p.join(',')).join('L')}L${pts[n-1][0]},${pad.t+f.ih}L${pts[0][0]},${pad.t+f.ih}Z" fill="var(--s1)" opacity=".12"/>`;
  s+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="var(--s1)" stroke-width="2"/>`;
  const last=pts[n-1];s+=`<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="${last[0]-8}" y="${last[1]-8}" text-anchor="end" style="fill:var(--ink)">${vals[n-1]}</text>`;
  pts.forEach((p,i)=>{s+=`<rect class="hit" x="${p[0]-f.iw/n/2}" y="${pad.t}" width="${f.iw/n}" height="${f.ih}" data-t="${T.months[i]}\nopen backlog: ${vals[i]}"/>`});
  s+=`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${pad.t+f.ih}" y2="${pad.t+f.ih}"/>`;
  $('#c-backlog').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Open backlog at month end">${s}</svg>`;
}
function drawArea(){
  const W=900,H=260,pad={l:34,r:8,t:8,b:24};const Q=T.quarters, top=T.areas.slice(0,8);
  const other=Q.map((q,i)=>T.areas.slice(8).reduce((a,k)=>a+T.area_q[k][i],0));
  const series=top.map((a,i)=>({name:a,vals:T.area_q[a],c:`var(--s${i+1})`})).concat([{name:'Other',vals:other,c:'var(--s9)'}]);
  const totals=Q.map((q,i)=>series.reduce((a,s)=>a+s.vals[i],0));
  const ymax=niceMax(Math.max(...totals));const f=frame(W,H,pad,ymax,4,Q,1);
  const bw=f.iw/Q.length, w=bw*.6; let s=f.s;
  Q.forEach((q,i)=>{let y=pad.t+f.ih;const x=pad.l+bw*i+(bw-w)/2;
    series.forEach(se=>{const v=se.vals[i];if(!v)return;const h=f.ih*v/ymax;y-=h;
      s+=`<rect class="mark" x="${x}" y="${y+1}" width="${w}" height="${Math.max(h-2,0)}" fill="${se.c}" data-t="${q}\n${se.name}: ${v} of ${totals[i]}"/>`});
    s+=`<text x="${x+w/2}" y="${y-5}" text-anchor="middle" style="fill:var(--ink)">${totals[i]}</text>`;
  });
  s+=`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${pad.t+f.ih}" y2="${pad.t+f.ih}"/>`;
  $('#c-area').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bugs raised per quarter by area">${s}</svg>`;
  $('#l-area').innerHTML=series.map(se=>`<span><i style="background:${se.c}"></i>${esc(se.name)} <span class="mono">${se.vals.reduce((a,b)=>a+b,0)}</span></span>`).join('');
}
drawFlow();drawBacklog();drawArea();
document.querySelectorAll('.viz svg').forEach(sv=>{sv.addEventListener('mouseover',e=>{const t=e.target.getAttribute('data-t');if(t)showTip(e,t)});sv.addEventListener('mousemove',e=>{if(tip.style.display==='block')moveTip(e)});sv.addEventListener('mouseleave',hideTip)});
</script>
