name: Database cleanup

on:
  workflow_call:
    inputs:
      postgres_db:
        description: Database name to recreate
        required: false
        type: string
        default: alkemio
  workflow_dispatch:
    inputs:
      postgres_db:
        description: Database name to recreate
        required: false
        type: string
        default: alkemio

jobs:
  cleanup-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kubectl
        uses: azure/setup-kubectl@v4.0.0
        with:
          version: "v1.29.6"

      - name: Set up Kubeconfig for Hetzner k3s
        run: |
          set -euo pipefail
          mkdir -p $HOME/.kube  # Ensure the .kube directory exists
          echo "${{ secrets.KUBECONFIG_SECRET_HETZNER_TEST }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Port-forward and reset Postgres database
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ inputs.postgres_db }}
        run: |
          set -euo pipefail

          # Port-forward to the PostgreSQL service in the background
          kubectl port-forward svc/postgres 5432:5432 > /tmp/port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!

          cleanup() {
            echo "Stopping port-forward (pid=$PORT_FORWARD_PID)"
            kill "$PORT_FORWARD_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for port-forward to become ready..."
          for i in $(seq 1 30); do
            if grep -q "Forwarding from" /tmp/port-forward.log; then
              break
            fi
            sleep 1
          done

          if ! grep -q "Forwarding from" /tmp/port-forward.log; then
            echo "Port-forward did not become ready"; cat /tmp/port-forward.log; exit 1
          fi

          # Drop all connections to the target database
          echo "Terminating active connections to $POSTGRES_DB..."
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$POSTGRES_DB' AND pid <> pg_backend_pid();"

          # Drop and recreate the database
          echo "Dropping and recreating database $POSTGRES_DB..."
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d postgres -c "DROP DATABASE IF EXISTS \"$POSTGRES_DB\";"
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$POSTGRES_DB\";"


  run-migration-and-boostrap:
    needs: cleanup-db
    runs-on: ubuntu-latest
    steps:
      - name: Install Kubectl
        uses: azure/setup-kubectl@v4.0.0
        with:
          version: "v1.29.6"

      - name: Set up Kubeconfig for Hetzner k3s
        run: |
          mkdir -p $HOME/.kube  # Ensure the .kube directory exists
          echo "${{ secrets.KUBECONFIG_SECRET_HETZNER_TEST }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      # apply the latest schema
      - name: Run migration job
        run: |
          # Define a unique job name based on the GitHub run ID
          MIGRATION_JOB_NAME="server-migration-job-${{ github.run_id }}"

          # Create the job from the cronjob
          kubectl create job --from=cronjob/server-migration $MIGRATION_JOB_NAME

          # Wait for the migration job to complete
          kubectl wait --for=condition=complete job/$MIGRATION_JOB_NAME --timeout=600s

          # Check job status and fail the step if the job didn't succeed
          MIGRATION_JOB_STATUS=$(kubectl get job $MIGRATION_JOB_NAME -o jsonpath='{.status.succeeded}')
          if [ "$MIGRATION_JOB_STATUS" != "1" ]; then
            echo "Migration job failed!"
            exit 1
          fi

          echo "Migration job completed successfully."
        # restart the server so it picks up the new database state and bootstraps
      - name: Restart deployment
        run: |
          # Restart the deployment
          kubectl rollout restart deployment/alkemio-server-deployment

          # Wait for the deployment to complete successfully
          kubectl rollout status deployment/alkemio-server-deployment --timeout=600s
