name: Database cleanup

# Replica counts are restored by CAPTURING what each deployment was actually
# running right before this job scales it to 0, and restoring that same
# number afterwards — never a hardcoded or configured constant. The GitOps
# manifests (dev-orchestration overlays) are the source of truth for how many
# replicas a service should run; this cleanup step has no opinion about
# capacity and must not silently flatten whatever was deployed.
#
# server_replicas / notifications_replicas exist ONLY as a fallback for when
# the live capture is unusable — empty, "0", or non-numeric, which happens if
# a previous run died mid-cleanup and left a deployment scaled to 0. Restoring
# a captured "0" would leave the environment dead, so the fallback steps in
# instead. Defaults match the current manifests (server=4, notifications=3)
# so an unset override can't reintroduce the flattening bug either.
on:
  workflow_call:
    inputs:
      postgres_db:
        description: Database name to recreate
        required: false
        type: string
        default: alkemio
      server_replicas:
        description: Fallback replica count for alkemio-server-deployment, used only when the live replica count can't be captured before cleanup
        required: false
        type: string
        default: "4"
      notifications_replicas:
        description: Fallback replica count for alkemio-notifications-deployment, used only when the live replica count can't be captured before cleanup
        required: false
        type: string
        default: "3"
  workflow_dispatch:
    inputs:
      postgres_db:
        description: Database name to recreate
        required: false
        type: string
        default: alkemio
      server_replicas:
        description: Fallback replica count for alkemio-server-deployment, used only when the live replica count can't be captured before cleanup
        required: false
        type: string
        default: "4"
      notifications_replicas:
        description: Fallback replica count for alkemio-notifications-deployment, used only when the live replica count can't be captured before cleanup
        required: false
        type: string
        default: "3"

jobs:
  cleanup-db:
    runs-on: ubuntu-latest
    outputs:
      server_replicas_restore: ${{ steps.scale-down.outputs.server_replicas_restore }}
      matrix_adapter_replicas_restore: ${{ steps.scale-down.outputs.matrix_adapter_replicas_restore }}
      synapse_replicas_restore: ${{ steps.scale-down.outputs.synapse_replicas_restore }}
      kratos_replicas_restore: ${{ steps.scale-down.outputs.kratos_replicas_restore }}
      kratos_courier_replicas_restore: ${{ steps.scale-down.outputs.kratos_courier_replicas_restore }}
      hydra_replicas_restore: ${{ steps.scale-down.outputs.hydra_replicas_restore }}
      oidc_service_replicas_restore: ${{ steps.scale-down.outputs.oidc_service_replicas_restore }}
      notifications_replicas_restore: ${{ steps.scale-down.outputs.notifications_replicas_restore }}
    steps:
      - name: Install Kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: "v1.29.6"

      - name: Set up Kubeconfig for Hetzner k3s
        run: |
          set -euo pipefail
          mkdir -p $HOME/.kube  # Ensure the .kube directory exists
          echo "${{ secrets.KUBECONFIG_SECRET_HETZNER_TEST }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Scale down services that hold database connections
        id: scale-down
        run: |
          set -euo pipefail

          # Capture the CURRENT live replica count for a resource before we
          # touch it. The manifests + whatever is actually deployed are the
          # source of truth for capacity, not this workflow — so we read it
          # back, not decide it. Defensive by design: `kubectl get` is
          # allowed to fail (missing resource, API hiccup) without aborting
          # the job under `set -e`, and the result is validated before use.
          # Falls back only when the live read is unusable — empty, "0" (a
          # deployment left at 0 by a previous run dying mid-cleanup), or
          # non-numeric — so a dead capture can never "restore" the
          # environment back into a dead state.
          capture_replicas() {
            local resource="$1" fallback="$2" value
            value=$(kubectl get "$resource" -o jsonpath='{.spec.replicas}' 2>/dev/null || true)
            if [[ "$value" =~ ^[0-9]+$ ]] && [ "$value" -gt 0 ]; then
              echo "$value"
            else
              echo "$fallback"
            fi
          }

          echo "Capturing replica counts to restore after cleanup..."
          # notifications-deployment is never scaled to 0 below (it doesn't
          # hold blocking DB connections during the wipe), but the later
          # migrate/restart job still force-sets its replica count — so it
          # gets the same capture-then-restore treatment as everything else,
          # captured here before anything can change it.
          SERVER_RESTORE=$(capture_replicas deployment/alkemio-server-deployment "${{ inputs.server_replicas }}")
          MATRIX_ADAPTER_RESTORE=$(capture_replicas deployment/alkemio-matrix-adapter-deployment "1")
          SYNAPSE_RESTORE=$(capture_replicas deployment/synapse-deployment "1")
          KRATOS_RESTORE=$(capture_replicas deployment/kratos "1")
          KRATOS_COURIER_RESTORE=$(capture_replicas statefulset/kratos-courier "1")
          HYDRA_RESTORE=$(capture_replicas deployment/hydra "1")
          OIDC_SERVICE_RESTORE=$(capture_replicas deployment/oidc-service "1")
          NOTIFICATIONS_RESTORE=$(capture_replicas deployment/alkemio-notifications-deployment "${{ inputs.notifications_replicas }}")

          echo "server=$SERVER_RESTORE matrix-adapter=$MATRIX_ADAPTER_RESTORE synapse=$SYNAPSE_RESTORE kratos=$KRATOS_RESTORE kratos-courier=$KRATOS_COURIER_RESTORE hydra=$HYDRA_RESTORE oidc-service=$OIDC_SERVICE_RESTORE notifications=$NOTIFICATIONS_RESTORE"

          {
            echo "server_replicas_restore=$SERVER_RESTORE"
            echo "matrix_adapter_replicas_restore=$MATRIX_ADAPTER_RESTORE"
            echo "synapse_replicas_restore=$SYNAPSE_RESTORE"
            echo "kratos_replicas_restore=$KRATOS_RESTORE"
            echo "kratos_courier_replicas_restore=$KRATOS_COURIER_RESTORE"
            echo "hydra_replicas_restore=$HYDRA_RESTORE"
            echo "oidc_service_replicas_restore=$OIDC_SERVICE_RESTORE"
            echo "notifications_replicas_restore=$NOTIFICATIONS_RESTORE"
          } >> "$GITHUB_OUTPUT"

          echo "Scaling down services that hold database connections..."
          kubectl scale deployment/alkemio-server-deployment --replicas=0
          kubectl scale deployment/alkemio-matrix-adapter-deployment --replicas=0
          kubectl scale deployment/synapse-deployment --replicas=0
          kubectl scale deployment/kratos --replicas=0
          kubectl scale statefulset/kratos-courier --replicas=0
          kubectl scale deployment/hydra --replicas=0
          # oidc-service holds live connections to the kratos/hydra DBs too;
          # leaving it up during the wipe left a mid-wipe outage window
          # (test-suites#555). Tolerate its absence on envs that don't run it.
          kubectl scale deployment/oidc-service --replicas=0 || true

          kubectl rollout status deployment/alkemio-server-deployment --timeout=120s
          kubectl rollout status deployment/alkemio-matrix-adapter-deployment --timeout=120s
          kubectl rollout status deployment/synapse-deployment --timeout=120s
          kubectl rollout status deployment/kratos --timeout=120s
          kubectl rollout status statefulset/kratos-courier --timeout=120s
          kubectl rollout status deployment/hydra --timeout=120s
          kubectl rollout status deployment/oidc-service --timeout=120s || true
          echo "All services scaled down."

      - name: Port-forward and reset all Postgres databases
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          # Port-forward to the PostgreSQL service in the background
          kubectl port-forward svc/postgres 5432:5432 > /tmp/port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!

          cleanup() {
            echo "Stopping port-forward (pid=$PORT_FORWARD_PID)"
            kill "$PORT_FORWARD_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for port-forward to become ready..."
          for i in $(seq 1 30); do
            if grep -q "Forwarding from" /tmp/port-forward.log; then
              break
            fi
            sleep 1
          done

          if ! grep -q "Forwarding from" /tmp/port-forward.log; then
            echo "Port-forward did not become ready"; cat /tmp/port-forward.log; exit 1
          fi

          # Discover all non-system databases
          echo "Discovering user databases..."
          DBS=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d postgres -t -A -c \
            "SELECT datname FROM pg_database WHERE datistemplate = false AND datname != 'postgres';")

          echo "Databases to reset: $DBS"

          for DB in $DBS; do
            echo "Dropping and recreating database $DB..."
            # WITH (FORCE) atomically terminates remaining connections and drops
            # the database in one step (PostgreSQL 13+)
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d postgres -c "DROP DATABASE IF EXISTS \"$DB\" WITH (FORCE);"
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$DB\";"
          done


  run-migration-and-boostrap:
    needs: cleanup-db
    runs-on: ubuntu-latest
    steps:
      - name: Install Kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: "v1.29.6"

      - name: Set up Kubeconfig for Hetzner k3s
        run: |
          mkdir -p $HOME/.kube  # Ensure the .kube directory exists
          echo "${{ secrets.KUBECONFIG_SECRET_HETZNER_TEST }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Fail loudly rather than let a bad kubectl scale silently no-op or
      # error deep inside a later step. These are the RESOLVED restore
      # targets from the cleanup-db job (captured live count, or its
      # fallback input when the capture was unusable) — validating them here
      # catches a bad fallback value too, not just a bad capture.
      - name: Validate replica-count inputs
        run: |
          set -euo pipefail
          for pair in \
            "server_replicas=${{ needs.cleanup-db.outputs.server_replicas_restore }}" \
            "matrix_adapter_replicas=${{ needs.cleanup-db.outputs.matrix_adapter_replicas_restore }}" \
            "synapse_replicas=${{ needs.cleanup-db.outputs.synapse_replicas_restore }}" \
            "kratos_replicas=${{ needs.cleanup-db.outputs.kratos_replicas_restore }}" \
            "kratos_courier_replicas=${{ needs.cleanup-db.outputs.kratos_courier_replicas_restore }}" \
            "hydra_replicas=${{ needs.cleanup-db.outputs.hydra_replicas_restore }}" \
            "oidc_service_replicas=${{ needs.cleanup-db.outputs.oidc_service_replicas_restore }}" \
            "notifications_replicas=${{ needs.cleanup-db.outputs.notifications_replicas_restore }}" \
          ; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ] || ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid $name '$value' — must be a non-negative integer"
              exit 1
            fi
          done
      # run Kratos migration on the fresh database, then restart the deployment
      - name: Migrate and restart Kratos
        run: |
          KRATOS_MIGRATION_JOB="kratos-migration-job-${{ github.run_id }}"
          KRATOS_IMAGE=$(kubectl get deployment kratos -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Using Kratos image: $KRATOS_IMAGE"

          # Idempotent: the job name is keyed on github.run_id, so a re-run of a
          # failed run collides with its own leftover job (a completed Job's spec
          # is immutable, so `apply` errors). Delete any prior instance first.
          kubectl delete job "$KRATOS_MIGRATION_JOB" --ignore-not-found --wait=true

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $KRATOS_MIGRATION_JOB
          spec:
            ttlSecondsAfterFinished: 120
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: kratos-migrate
                    image: $KRATOS_IMAGE
                    command: ["kratos"]
                    args: ["migrate", "sql", "-e", "--yes"]
                    env:
                      - name: DSN
                        valueFrom:
                          secretKeyRef:
                            name: kratos
                            key: dsn
          EOF

          kubectl wait --for=condition=complete job/$KRATOS_MIGRATION_JOB --timeout=600s

          # Scale back up to the count captured before cleanup scaled it to 0
          # (or its fallback) — never a hardcoded constant. See "Scale down
          # services..." in the cleanup-db job for why.
          kubectl scale deployment/kratos --replicas=${{ needs.cleanup-db.outputs.kratos_replicas_restore }}
          kubectl scale statefulset/kratos-courier --replicas=${{ needs.cleanup-db.outputs.kratos_courier_replicas_restore }}
          kubectl rollout status deployment/kratos --timeout=600s
          kubectl rollout status statefulset/kratos-courier --timeout=600s

      # run Hydra migration on the fresh database, then restart the deployment
      - name: Migrate and restart Hydra
        run: |
          HYDRA_MIGRATION_JOB="hydra-migration-job-${{ github.run_id }}"
          HYDRA_IMAGE=$(kubectl get deployment hydra -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Using Hydra image: $HYDRA_IMAGE"

          # Idempotent (see Kratos step): delete any leftover job from a re-run
          # before re-creating, since a completed Job's spec is immutable.
          kubectl delete job "$HYDRA_MIGRATION_JOB" --ignore-not-found --wait=true

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $HYDRA_MIGRATION_JOB
          spec:
            ttlSecondsAfterFinished: 120
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: hydra-migrate
                    image: $HYDRA_IMAGE
                    command: ["hydra"]
                    args: ["migrate", "sql", "-e", "--yes"]
                    env:
                      - name: POSTGRES_USER
                        valueFrom:
                          configMapKeyRef:
                            name: alkemio-config
                            key: POSTGRES_USER
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          configMapKeyRef:
                            name: alkemio-config
                            key: POSTGRES_PASSWORD
                      - name: DSN
                        value: "postgres://\$(POSTGRES_USER):\$(POSTGRES_PASSWORD)@postgres:5432/hydra?sslmode=disable"
          EOF

          kubectl wait --for=condition=complete job/$HYDRA_MIGRATION_JOB --timeout=600s

          # Scale back up to the count captured before cleanup scaled it to 0
          # (or its fallback) — never a hardcoded constant.
          kubectl scale deployment/hydra --replicas=${{ needs.cleanup-db.outputs.hydra_replicas_restore }}
          kubectl rollout status deployment/hydra --timeout=600s

      # Wiping the hydra DB drops its OAuth2 client rows. hydra-maester only
      # re-registers clients on OAuth2Client CR *change* events, so after a wipe
      # it never reconciles the now-empty DB and the env comes back green at pod
      # level with zero clients — every login dies with `invalid_client`,
      # invisible to all health checks (test-suites#555). Force a reconcile and
      # ASSERT clients exist before declaring the env ready.
      - name: Restore Hydra OAuth2 clients (hydra-maester) and assert
        run: |
          set -euo pipefail
          kubectl rollout restart deployment/hydra-hydra-maester
          kubectl rollout status  deployment/hydra-hydra-maester --timeout=180s

          echo "Asserting Hydra has registered OAuth2 clients (login health != pod health)..."
          kubectl run hydra-client-check-${{ github.run_id }} \
            --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            sh -c '
              for i in $(seq 1 30); do
                n=$(curl -sf http://hydra-admin:4445/admin/clients | grep -o "client_id" | wc -l) || n=0
                echo "  attempt $i: $n client(s)"
                [ "$n" -ge 2 ] && exit 0
                sleep 5
              done
              echo "Hydra OAuth2 clients not restored — login would be broken"; exit 1'

      # Scale up dependencies before server migration: Synapse + matrix adapter
      - name: Start Synapse and supporting services
        run: |
          # Every restore below uses the count captured before cleanup-db
          # scaled the deployment to 0 (or its fallback), never a hardcoded
          # or configured constant — the GitOps manifests are the source of
          # truth for capacity and this workflow must not have an opinion.
          kubectl scale deployment/synapse-deployment --replicas=${{ needs.cleanup-db.outputs.synapse_replicas_restore }}
          kubectl rollout status deployment/synapse-deployment --timeout=600s

          kubectl scale deployment/alkemio-matrix-adapter-deployment --replicas=${{ needs.cleanup-db.outputs.matrix_adapter_replicas_restore }}
          # notifications-deployment is never scaled to 0 (see cleanup-db),
          # but this step still force-sets its count, so it gets the same
          # captured-count restore as everything else rather than a
          # hardcoded/configured number.
          kubectl scale deployment/alkemio-notifications-deployment --replicas=${{ needs.cleanup-db.outputs.notifications_replicas_restore }}
          kubectl scale deployment/alkemio-file-service-deployment --replicas=1
          # Restore oidc-service (scaled to 0 before the wipe)
          kubectl scale deployment/oidc-service --replicas=${{ needs.cleanup-db.outputs.oidc_service_replicas_restore }} || true
          kubectl rollout status deployment/alkemio-matrix-adapter-deployment --timeout=600s
          kubectl rollout status deployment/alkemio-notifications-deployment --timeout=600s
          kubectl rollout status deployment/alkemio-file-service-deployment --timeout=600s
          kubectl rollout status deployment/oidc-service --timeout=600s || true

      # apply the latest schema
      - name: Run migration job
        run: |
          # Define a unique job name based on the GitHub run ID
          MIGRATION_JOB_NAME="server-migration-job-${{ github.run_id }}"

          # Idempotent: this job (created via --from=cronjob) has no
          # ttlSecondsAfterFinished, so it never self-cleans — a re-run of a
          # failed run hits `job already exists` on the create below. Delete any
          # leftover instance first (test-suites#555).
          kubectl delete job "$MIGRATION_JOB_NAME" --ignore-not-found --wait=true

          # Create the job from the cronjob
          kubectl create job --from=cronjob/server-migration $MIGRATION_JOB_NAME

          # Wait for the migration job to complete
          kubectl wait --for=condition=complete job/$MIGRATION_JOB_NAME --timeout=600s

          # Check job status and fail the step if the job didn't succeed
          MIGRATION_JOB_STATUS=$(kubectl get job $MIGRATION_JOB_NAME -o jsonpath='{.status.succeeded}')
          if [ "$MIGRATION_JOB_STATUS" != "1" ]; then
            echo "Migration job failed!"
            exit 1
          fi

          echo "Migration job completed successfully."
        # Scale server back up so it picks up the new database state and
        # bootstraps, restoring the count captured before cleanup-db scaled
        # it to 0 (or its fallback) — never a hardcoded or configured
        # constant, so a manually or GitOps-provisioned capacity level
        # survives the nightly wipe instead of being flattened.
      - name: Start server deployment
        run: |
          kubectl scale deployment/alkemio-server-deployment --replicas=${{ needs.cleanup-db.outputs.server_replicas_restore }}
          kubectl rollout status deployment/alkemio-server-deployment --timeout=600s

      # `rollout status` returning does NOT mean the API is answering: on a fresh
      # DB the server does a multi-minute bootstrap (auth reset, platform/space
      # seeding) before it listens — which produced ~500 ECONNRESET test
      # failures in run 28944454812 (test-suites#555). Gate on a real GraphQL
      # round-trip before returning.
      #
      # Probe the server's in-cluster ClusterIP service directly, NOT the public
      # test-alkem.io URL. Two reasons: (1) test-alkem.io is unreachable from
      # this ubuntu-latest runner, and (2) even from inside the cluster, curling
      # the public hostname resolves to the external LoadBalancer IP and must
      # hairpin-NAT back in — which is per-node flaky and returned HTTP 000 for
      # a whole probe window while the server was healthy and listening (run
      # 29004235896). The internal service has no DNS/hairpin dependency and is
      # the meaningful signal here (is the server serving GraphQL); traefik
      # itself is always up, so the external path follows once the server is.
      - name: Wait for server API readiness
        run: |
          set -euo pipefail
          echo "Probing alkemio-server-service:4000/graphql from inside the cluster..."
          kubectl run api-readiness-check-${{ github.run_id }}-${{ github.run_attempt }} \
            --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            sh -c '
              for i in $(seq 1 60); do
                body=$(curl -s -m 8 -w "\n%{http_code}" -X POST http://alkemio-server-service:4000/graphql \
                  -H "Content-Type: application/json" \
                  --data "{\"query\":\"{ __typename }\"}") || body="000"
                code=$(printf "%s" "$body" | tail -n1)
                echo "  attempt $i: HTTP $code"
                if [ "$code" = "200" ] && printf "%s" "$body" | grep -q "\"data\""; then
                  echo "Server API ready after $i attempt(s)."
                  exit 0
                fi
                sleep 5
              done
              echo "Server API not ready after 60 attempts"; exit 1'
