# Since the reporting data generated by Playwright tests can accumulate over time,
# this workflow periodically cleans up old report data from the gh-pages branch
# to manage storage usage. It deletes report data directories older than a
# specified retention period (10 days) while preserving the main index.html file and the results.
name: Cleanup old Playwright report data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  cleanup:
    runs-on: arc-runner-set
    permissions:
      contents: write

    steps:
      # Check out gh-pages (best-effort: branch may not exist yet)
      - name: Checkout GitHub Pages content (gh-pages)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: out
          fetch-depth: 0

      - name: Delete Playwright report data older than retention period
        shell: bash
        env:
          RETENTION_DAYS: "10"
        run: |
          set -euo pipefail

          if [ ! -d "out" ]; then
            echo "No checkout directory found. Nothing to clean."
            exit 0
          fi

          cd out

          if [ ! -d .git ]; then
            echo "gh-pages branch doesn't exist yet (checkout failed). Nothing to clean."
            exit 0
          fi

          ROOT="gh-pages-root/playwright"
          if [ ! -d "$ROOT" ]; then
            echo "No playwright report directory found at $ROOT. Nothing to clean."
            exit 0
          fi

          threshold_epoch=$(date -u -d "-${RETENTION_DAYS} days" +%s)

          # Report layout (from nightly workflow):
          #   $ROOT/YYYY-MM-DD/RUN_ID/<playwright-report contents>
          # where <playwright-report contents> includes data/ and trace/
          for dateDir in "$ROOT"/*; do
            base=$(basename "$dateDir")
            [ -d "$dateDir" ] || continue
            [ "$base" = "index.html" ] && continue

            if [[ ! "$base" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Skipping non-date directory: $dateDir"
              continue
            fi

            date_epoch=$(date -u -d "$base" +%s)
            if [ "$date_epoch" -ge "$threshold_epoch" ]; then
              continue
            fi

            echo "Deleting data/ and trace/ under $dateDir (older than ${RETENTION_DAYS} days)"

            # Each RUN_ID folder contains the copied playwright-report output.
            for runDir in "$dateDir"/*; do
              [ -d "$runDir" ] || continue
              rm -rf "$runDir/data" "$runDir/trace" 2>/dev/null || true
            done
          done

          git status --porcelain

      - name: Commit and push cleanup to gh-pages
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RETENTION_DAYS: "10"
        run: |
          set -euo pipefail
          cd out

          if [ ! -d .git ]; then
            echo "No gh-pages checkout. Nothing to push."
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git checkout gh-pages || git checkout -b gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Prune Playwright report data dirs older than ${RETENTION_DAYS} days"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
