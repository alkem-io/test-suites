name: Build patched MailSlurper image

# Builds infra/mailslurper (Ory's smtps fork + the patches in that directory)
# and publishes it to this repository's package registry. See
# infra/mailslurper/README.md for what the patches fix and why.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'infra/mailslurper/**'
      - '.github/workflows/build-mailslurper-image.yml'
  pull_request:
    paths:
      - 'infra/mailslurper/**'
      - '.github/workflows/build-mailslurper-image.yml'

env:
  IMAGE: ghcr.io/alkem-io/test-suites/mailslurper
  # <variant>-<upstream commit>-p<patch level>. Bump pN when a patch changes.
  TAG: smtps-4c6aecc-p2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build only, proving the patches still apply and compile;
      # publishing happens from develop or a manual run.
      - name: Build (and publish outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: infra/mailslurper
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=oryd/mailslurper:latest-smtps with the connection-pool leak and SQLite lock fixes
