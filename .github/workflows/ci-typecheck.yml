name: TypeScript Native Typecheck

on:
  pull_request:

concurrency:
  group: ci-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: 'pnpm'

      - name: Install workspace dependencies (lib, server-api, client-web)
        run: pnpm install --frozen-lockfile

      - name: Native TS7 typecheck — lib (workspace#019-typescript-7-upgrade)
        run: pnpm --filter @alkemio/tests-lib run typecheck:native

      - name: Native TS7 typecheck — server-api (workspace#019-typescript-7-upgrade)
        run: pnpm --filter @alkemio/test-suite-server-api run typecheck:native

      # PR-time drift gate for the nightly two-lane split: proves the
      # parallel/serial partition and that no promoted file trips a hazard
      # rule, so lane-membership drift is caught at review time rather than
      # surfacing as a flaky nightly.
      - name: Nightly lane guard
        run: pnpm --filter @alkemio/test-suite-server-api run lanes:validate

      # PR-time accountability gate: every unconditional skip
      # (test.skip/it.skip/describe.skip and their .each/xit/xdescribe
      # forms) in the functional-api suite must cite a bug or issue within a
      # few lines above it, or be a grandfathered pre-existing entry in
      # UNDOCUMENTED_SKIPS — a closed, shrinking allowlist. Fails closed on
      # a new undocumented skip and on a stale allowlist entry alike, same
      # discipline as the lane guard above.
      - name: Skip-citation guard
        run: pnpm --filter @alkemio/test-suite-server-api run skips:validate

      # Self-tests for the nightly-parallel harness's own scripts (lane
      # guard, skip-citation guard, mint-hoist smoke helpers, serial-confirm
      # and baseline-diff verdict logic). Pure Node — no live stack needed —
      # so there is no excuse for these regressing silently between
      # nightlies; run them every PR.
      - name: Nightly harness script self-tests
        run: node --test scripts/

      - name: Native TS7 typecheck — client-web (workspace#019-typescript-7-upgrade)
        run: pnpm --filter @alkemio/test-suite-client-web run typecheck:native

      - name: Install load-testing dependencies
        working-directory: load-testing
        run: npm ci

      - name: Native TS7 typecheck — load-testing (workspace#019-typescript-7-upgrade)
        working-directory: load-testing
        run: npm run typecheck:native
