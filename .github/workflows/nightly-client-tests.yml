name: Nightly Playwright E2E

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: arc-runner-set
    permissions:
      contents: write

    #container:
    # it is recommended to match the image version with the installed playwright version
    #      image: mcr.microsoft.com/playwright:v1.57.0-noble

    steps:
      - uses: actions/checkout@v5

      # Pull the existing GitHub Pages site so we can append this run's report
      # and keep a full history (incremental runs) across deployments.
      - name: Checkout existing GitHub Pages content (gh-pages)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: out
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.6

      - name: Install lib dependencies
        run: |
          cd lib
          npm ci

      - name: Install server-api dependencies
        run: |
          cd server-api
          npm ci

      - name: Install client-web dependencies
        run: |
          cd client-web
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd client-web
          npx playwright install --with-deps

      - name: Set run folder variables
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "RUN_DATE=$DATE" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Register users
        env:
          ALKEMIO_SERVER: ${{ vars.ALKEMIO_SERVER }}
          ALKEMIO_SERVER_URL: ${{ vars.ALKEMIO_SERVER_URL }}
          KRATOS_ENDPOINT: ${{ vars.KRATOS_ENDPOINT }}
          MAIL_SLURPER_ENDPOINT: ${{ vars.MAIL_SLURPER_ENDPOINT }}
          AUTH_TEST_HARNESS_PASSWORD: ${{ secrets.AUTH_TEST_HARNESS_PASSWORD }}
        run: |
          cd client-web
          npm run register-users

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        env:
          ALKEMIO_BASE_URL: ${{ vars.ALKEMIO_BASE_URL }}
          ALKEMIO_SERVER: ${{ vars.ALKEMIO_SERVER }}
          ALKEMIO_SERVER_REST: ${{ vars.ALKEMIO_SERVER_REST }}
          ALKEMIO_SERVER_URL: ${{ vars.ALKEMIO_SERVER_URL }}
          ALKEMIO_SERVER_WS: ${{ vars.ALKEMIO_SERVER_WS }}
          KRATOS_ENDPOINT: ${{ vars.KRATOS_ENDPOINT }}
          MAIL_SLURPER_ENDPOINT: ${{ vars.MAIL_SLURPER_ENDPOINT }}
          NPM_CONFIG_ENGINE_STRICT: ${{ vars.NPM_CONFIG_ENGINE_STRICT }}
          AUTH_TEST_HARNESS_PASSWORD: ${{ secrets.AUTH_TEST_HARNESS_PASSWORD }}
        run: |
          cd client-web
          npx playwright test --config=config/playwright.config.nightly.ts

      - name: Capture Playwright outcome
        if: ${{ always() }}
        run: |
          echo "PLAYWRIGHT_OUTCOME=${{ steps.playwright.outcome }}" >> $GITHUB_ENV

      - name: Organize report for GitHub Pages
        run: |
          # Ensure output directory exists even if gh-pages checkout failed or branch doesn't exist yet.
          mkdir -p out
          TARGET="nightly/$RUN_DATE/$RUN_ID"
          mkdir -p out/$TARGET
          cp -r client-web/playwright-report/* out/$TARGET/

      - name: Add run metadata
        run: |
          echo "Run ID: $RUN_ID" > out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt
          echo "Date: $RUN_DATE" >> out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt
          echo "Branch: $GITHUB_REF" >> out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt
          echo "Commit: $GITHUB_SHA" >> out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt
          echo "Playwright outcome: ${PLAYWRIGHT_OUTCOME:-unknown}" >> out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt

          echo "$GITHUB_SHA" > out/nightly/$RUN_DATE/$RUN_ID/commit.txt
          echo "${GITHUB_REF_NAME:-unknown}" > out/nightly/$RUN_DATE/$RUN_ID/branch.txt

          if [ "${PLAYWRIGHT_OUTCOME:-}" = "success" ]; then
            echo "passed" > out/nightly/$RUN_DATE/$RUN_ID/status.txt
          else
            echo "failed" > out/nightly/$RUN_DATE/$RUN_ID/status.txt
          fi

      - name: Generate summary index.html
        run: |
          mkdir -p out
          INDEX="out/index.html"
          cat > $INDEX << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Nightly Reports</title>
              <style>
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 24px; line-height: 1.4; }
                h1 { margin: 0 0 12px 0; }
                h2 { margin: 20px 0 8px 0; }
                ul { margin: 0 0 12px 0; }
              </style>
            </head>
            <body>
              <h1>Nightly Playwright E2E Reports</h1>
          EOF

          # Render by date with runs underneath (newest-first)
          if [ -d "out/nightly" ]; then
            for dateDir in $(ls -1 out/nightly | sort -r); do
              [ -d "out/nightly/$dateDir" ] || continue
              echo "<h2>$dateDir</h2>" >> $INDEX
              echo "<ul>" >> $INDEX

              for runDir in $(ls -1 "out/nightly/$dateDir" | sort -r); do
                [ -d "out/nightly/$dateDir/$runDir" ] || continue
                statusFile="out/nightly/$dateDir/$runDir/status.txt"
                commitFile="out/nightly/$dateDir/$runDir/commit.txt"
                branchFile="out/nightly/$dateDir/$runDir/branch.txt"
                status="unknown"
                if [ -f "$statusFile" ]; then
                  status=$(tr -d '\n\r' < "$statusFile")
                fi

                shaShort="unknown"
                if [ -f "$commitFile" ]; then
                  shaShort=$(tr -d '\n\r' < "$commitFile" | cut -c1-7)
                fi

                branchName="unknown"
                if [ -f "$branchFile" ]; then
                  branchName=$(tr -d '\n\r' < "$branchFile")
                fi

                icon="❔"
                if [ "$status" = "passed" ]; then
                  icon="✅"
                elif [ "$status" = "failed" ]; then
                  icon="❌"
                fi

                echo "  <li>$icon <a href=\"nightly/$dateDir/$runDir/\">$runDir ($shaShort - $branchName)</a></li>" >> $INDEX
              done

              echo "</ul>" >> $INDEX
            done
          else
            echo "<p>No reports yet.</p>" >> $INDEX
          fi

          cat >> $INDEX << 'EOF'
            </body>
          </html>
          EOF

      # Persist the accumulated report history so next runs can append and re-index.
      - name: Commit updated reports to gh-pages branch
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd out

          if [ ! -d .git ]; then
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git checkout gh-pages || git checkout -b gh-pages
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update Playwright report: ${RUN_DATE}/${RUN_ID}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Fail job if Playwright tests failed
        if: ${{ steps.playwright.outcome == 'failure' }}
        run: exit 1

  deploy:
    # deploy regardless of test outcome so failures still publish reports
    if: ${{ always() }}
    needs: test
    uses: ./.github/workflows/deploy-github-pages.yml
    with:
      ref: gh-pages
      path: .
