name: Playwright E2E

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: arc-runner-set

    #container:
    # it is recommended to match the image version with the installed playwright version
    #      image: mcr.microsoft.com/playwright:v1.57.0-noble

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.6

      - name: Install lib dependencies
        run: cd lib && npm ci

      - name: Install server-api dependencies
        run: cd server-api && npm ci

      - name: Install client-web dependencies
        run: cd client-web && npm ci

      - name: Install Playwright Browsers
        run:  cd client-web && npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          ALKEMIO_BASE_URL: ${{ vars.ALKEMIO_BASE_URL }}
          ALKEMIO_SERVER: ${{ vars.ALKEMIO_SERVER }}
          ALKEMIO_SERVER_REST: ${{ vars.ALKEMIO_SERVER_REST }}
          ALKEMIO_SERVER_URL: ${{ vars.ALKEMIO_SERVER_URL }}
          ALKEMIO_SERVER_WS: ${{ vars.ALKEMIO_SERVER_WS }}
          KRATOS_ENDPOINT: ${{ vars.KRATOS_ENDPOINT }}
          MAIL_SLURPER_ENDPOINT: ${{ vars.MAIL_SLURPER_ENDPOINT }}
          NPM_CONFIG_ENGINE_STRICT: ${{ vars.NPM_CONFIG_ENGINE_STRICT }}
          AUTH_TEST_HARNESS_PASSWORD: ${{ secrets.AUTH_TEST_HARNESS_PASSWORD }}
        run: cd client-web && npx playwright test --config=config/playwright.config.nightly.ts

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client-web/playwright-report/
          retention-days: 5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0
      - name: Upload Playwright Report to GitHub Pages
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: client-web/playwright-report/

  deploy:
    #  ensures the job is considered for execution no matter the outcome of the previous job, including failures.
    if: ${{ always() }}
    needs: test
    runs-on: arc-runner-set
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4.0.5
