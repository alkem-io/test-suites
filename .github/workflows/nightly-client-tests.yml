name: Nightly Playwright E2E

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: arc-runner-set

    #container:
    # it is recommended to match the image version with the installed playwright version
    #      image: mcr.microsoft.com/playwright:v1.57.0-noble

    steps:
      - uses: actions/checkout@v5

      # Pull the existing GitHub Pages site so we can append this run's report
      # and keep a full history (incremental runs) across deployments.
      - name: Checkout existing GitHub Pages content (gh-pages)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: out
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.6

      - name: Install lib dependencies
        run: |
          cd lib
          npm ci

      - name: Install server-api dependencies
        run: |
          cd server-api
          npm ci

      - name: Install client-web dependencies
        run: |
          cd client-web
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd client-web
          npx playwright install --with-deps

      - name: Set run folder variables
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "RUN_DATE=$DATE" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Register users
        env:
          ALKEMIO_SERVER: ${{ vars.ALKEMIO_SERVER }}
          ALKEMIO_SERVER_URL: ${{ vars.ALKEMIO_SERVER_URL }}
          KRATOS_ENDPOINT: ${{ vars.KRATOS_ENDPOINT }}
          MAIL_SLURPER_ENDPOINT: ${{ vars.MAIL_SLURPER_ENDPOINT }}
          AUTH_TEST_HARNESS_PASSWORD: ${{ secrets.AUTH_TEST_HARNESS_PASSWORD }}
        run: |
          cd client-web
          npm run register-users

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        env:
          ALKEMIO_BASE_URL: ${{ vars.ALKEMIO_BASE_URL }}
          ALKEMIO_SERVER: ${{ vars.ALKEMIO_SERVER }}
          ALKEMIO_SERVER_REST: ${{ vars.ALKEMIO_SERVER_REST }}
          ALKEMIO_SERVER_URL: ${{ vars.ALKEMIO_SERVER_URL }}
          ALKEMIO_SERVER_WS: ${{ vars.ALKEMIO_SERVER_WS }}
          KRATOS_ENDPOINT: ${{ vars.KRATOS_ENDPOINT }}
          MAIL_SLURPER_ENDPOINT: ${{ vars.MAIL_SLURPER_ENDPOINT }}
          NPM_CONFIG_ENGINE_STRICT: ${{ vars.NPM_CONFIG_ENGINE_STRICT }}
          AUTH_TEST_HARNESS_PASSWORD: ${{ secrets.AUTH_TEST_HARNESS_PASSWORD }}
        run: |
          cd client-web
          npx playwright test --config=config/playwright.config.nightly.ts

      - name: Organize report for GitHub Pages
        run: |
          # Ensure output directory exists even if gh-pages checkout failed or branch doesn't exist yet.
          mkdir -p out
          # Avoid uploading git metadata inside the Pages artifact.
          rm -rf out/.git
          TARGET="nightly/$RUN_DATE/$RUN_ID"
          mkdir -p out/$TARGET
          cp -r client-web/playwright-report/* out/$TARGET/

      - name: Add run metadata
        run: |
          echo "Run ID: $RUN_ID" > out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt
          echo "Date: $RUN_DATE" >> out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt
          echo "Branch: $GITHUB_REF" >> out/nightly/$RUN_DATE/$RUN_ID/runinfo.txt

      - name: Generate summary index.html
        run: |
          mkdir -p out
          INDEX="out/index.html"
          cat > $INDEX << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Nightly Reports</title></head>
          <body>
          <h1>Nightly Playwright E2E Reports</h1>
          <ul>
          EOF

          # Build a full list of all stored runs (across all prior deployments).
          # Sort newest-first for convenience.
          if [ -d "out/nightly" ]; then
            find out/nightly -mindepth 2 -maxdepth 2 -type d -printf '%P\n' | sort -r | while read -r entry; do
              DATE="${entry%%/*}"
              RID="${entry##*/}"
              echo "  <li><a href=\"nightly/$DATE/$RID/\">$DATE / $RID</a></li>" >> $INDEX
            done
          fi

          cat >> $INDEX << 'EOF'
          </ul>
          </body></html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/

      - name: Fail job if Playwright tests failed
        if: ${{ steps.playwright.outcome == 'failure' }}
        run: exit 1

  deploy:
    #  ensures the job is considered for execution no matter the outcome of the previous job, including failures.
    if: ${{ always() }}
    needs: test
    runs-on: arc-runner-set
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4.0.5
