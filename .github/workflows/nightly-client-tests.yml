name: Nightly Playwright

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    #container:
    # it is recommended to match the image version with the installed playwright version
    #      image: mcr.microsoft.com/playwright:v1.57.0-noble

    steps:
      - uses: actions/checkout@v7

      # Pull the existing GitHub Pages site so we can append this run's report
      # and keep a full history (incremental runs) across deployments.
      - name: Checkout existing GitHub Pages content (gh-pages)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: out
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        # The nightly config pins channel: 'chrome' (branded Chrome, matching the
        # interactive config), so install that channel explicitly — the default
        # `playwright install` only provisions the bundled Chromium.
        run: pnpm --filter @alkemio/test-suite-client-web exec playwright install --with-deps chromium chrome

      - name: Set run folder variables
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "RUN_DATE=$DATE" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        env:
          ALKEMIO_BASE_URL: ${{ vars.ALKEMIO_BASE_URL }}
          ALKEMIO_SERVER: ${{ vars.ALKEMIO_SERVER }}
          ALKEMIO_SERVER_REST: ${{ vars.ALKEMIO_SERVER_REST }}
          ALKEMIO_SERVER_URL: ${{ vars.ALKEMIO_SERVER_URL }}
          ALKEMIO_SERVER_WS: ${{ vars.ALKEMIO_SERVER_WS }}
          KRATOS_ENDPOINT: ${{ vars.KRATOS_ENDPOINT }}
          MAIL_SLURPER_ENDPOINT: ${{ vars.MAIL_SLURPER_ENDPOINT }}
          AUTH_TEST_HARNESS_PASSWORD: ${{ secrets.AUTH_TEST_HARNESS_PASSWORD }}
        run: pnpm --filter @alkemio/test-suite-client-web run test:nightly

      # gh-pages is a PUBLIC GitHub Pages site. Playwright trace bundles
      # (data/*.zip) and videos (data/*.webm) record full network traffic,
      # including live test-environment session cookies and request bodies —
      # publishing them leaks live auth material. Pull them out into a
      # private, retention-limited artifact before the report is published;
      # screenshots and the report UI/summary are untouched.
      - name: Quarantine Playwright trace/video attachments before publish
        if: ${{ always() }}
        run: |
          STAGE="client-web/pw-private-attachments"
          REPORT_DIR="client-web/playwright-report"
          mkdir -p "$STAGE"
          if [ -d "$REPORT_DIR/data" ]; then
            find "$REPORT_DIR/data" -maxdepth 1 \( -name '*.zip' -o -name '*.webm' \) -exec mv {} "$STAGE/" \;
          fi
          # The bundled trace-viewer app is only useful alongside the trace
          # .zip files it renders, which are gone now — drop it too.
          rm -rf "$REPORT_DIR/trace"

      - name: Upload trace/video attachments (private, debug-only)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-bundles-${{ github.run_id }}
          path: client-web/pw-private-attachments
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish report to GitHub Pages
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/publish-report.sh \
            "playwright" \
            "Playwright" \
            "client-web/playwright-report" \
            "${{ steps.playwright.outcome }}"

      - name: Fail job if Playwright tests failed
        if: ${{ steps.playwright.outcome == 'failure' }}
        run: exit 1

  deploy:
    # deploy regardless of test outcome so failures still publish reports
    if: ${{ always() }}
    needs: test
    uses: ./.github/workflows/deploy-github-pages.yml
    with:
      ref: gh-pages
      path: gh-pages-root
