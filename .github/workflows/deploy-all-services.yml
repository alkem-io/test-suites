name: Deploy All Services to Test Environment

on:
  workflow_call:
  workflow_dispatch:

jobs:
  patch-and-restart-deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kubectl
        uses: azure/setup-kubectl@v4.0.0
        with:
          version: "v1.29.6"

      - name: Set up Kubeconfig for Hetzner k3s
        run: |
          set -euo pipefail
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_SECRET_HETZNER_TEST }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Patch all Alkemio deployments to use latest images
        run: |
          set -euo pipefail
          PATCHED=""

          for deploy in $(kubectl get deployments -o jsonpath='{.items[*].metadata.name}'); do
            if [[ "$deploy" != alkemio-* && "$deploy" != "oidc-service" ]]; then
              echo "Skipping $deploy (not an Alkemio deployment)"
              continue
            fi

            CURRENT_IMAGE=$(kubectl get deployment "$deploy" -o jsonpath='{.spec.template.spec.containers[0].image}')
            BASE_IMAGE="${CURRENT_IMAGE%:*}"
            CONTAINER_NAME=$(kubectl get deployment "$deploy" -o jsonpath='{.spec.template.spec.containers[0].name}')

            echo "Patching $deploy: $CURRENT_IMAGE -> ${BASE_IMAGE}:latest"
            kubectl set image "deployment/$deploy" "$CONTAINER_NAME=${BASE_IMAGE}:latest"
            PATCHED="$PATCHED $deploy"
          done

          echo "PATCHED_DEPLOYMENTS=$PATCHED" >> $GITHUB_ENV

      - name: Wait for all rollouts to complete
        run: |
          set -euo pipefail
          FAILED=""

          for deploy in $PATCHED_DEPLOYMENTS; do
            echo "Waiting for $deploy rollout..."
            if ! kubectl rollout status "deployment/$deploy" --timeout=600s; then
              echo "FAILED: $deploy did not complete rollout"
              FAILED="$FAILED $deploy"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "The following deployments failed to roll out:$FAILED"
            exit 1
          fi

          echo "All Alkemio deployments rolled out successfully!"
