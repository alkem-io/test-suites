query GetTemplateById($templateId: UUID!) {
  lookup {
    template(ID: $templateId) {
      id
      type
      nameID
      profile {
        id
        displayName
        description
      }
      authorization {
        myPrivileges
      }
      contentSpace {
        id
      }
      whiteboard {
        id
      }
      callout {
        id
      }
      postDefaultDescription
    }
  }
}
