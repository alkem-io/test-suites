# Swaps ONLY the MailSlurper image of the Alkemio dev stack for the patched
# build in this directory. Nothing else about the service changes (same
# container name, ports, network), so Kratos, the notifications service and the
# tests need no reconfiguration.
#
# Build the image first, from this directory — the override deliberately has no
# `build:` block, because Compose resolves a relative build context against the
# FIRST -f file (the server repo's), not against this one:
#
#   docker build -t ghcr.io/alkem-io/test-suites/mailslurper:smtps-4c6aecc-p2 .
#
# Then, from the server repo root, recreate just that one container:
#
#   docker compose -p alkemio-serverdev -f quickstart-services.yml \
#     -f <path-to-test-suites>/infra/mailslurper/docker-compose.override.yml \
#     --env-file .env.docker up -d --no-deps --no-build mailslurper
#
# `--no-deps mailslurper` leaves the rest of the running stack alone. Drop the
# override (and `up -d mailslurper` again) to go back to the stock image. Once
# the image is published, `docker pull` replaces the local build step.
services:
  mailslurper:
    image: ghcr.io/alkem-io/test-suites/mailslurper:smtps-4c6aecc-p2
